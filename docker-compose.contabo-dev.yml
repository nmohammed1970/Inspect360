# Inspect360 DEV portal — joins shared Caddy network + shared postgres.
# Separate container, env, volume, and DB from production.
#
# On Contabo:
#   mkdir -p /opt/inspect360-dev && place .env there (see deployment/env.contabo-dev.template)
#   IMAGE=ghcr.io/nmohammed1970/inspect360:dev docker compose -f docker-compose.contabo-dev.yml up -d

services:
  inspect360-dev:
    image: ${IMAGE:-ghcr.io/nmohammed1970/inspect360:dev}
    container_name: inspect360-dev
    restart: unless-stopped
    env_file:
      - /opt/inspect360-dev/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOST: "0.0.0.0"
      RUNNING_IN_DOCKER: "true"
      LOCAL_STORAGE_DIR: /app/storage
    volumes:
      - inspect360_dev_storage:/app/storage
    networks:
      - caddy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  inspect360_dev_storage:

networks:
  caddy:
    external: true
