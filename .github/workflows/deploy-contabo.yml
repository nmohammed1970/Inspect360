name: Build and deploy Inspect360

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase for GHCR)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.contabo.yml
          target: /opt/inspect360/

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            mkdir -p /opt/inspect360

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"

            if [ ! -f /opt/inspect360/docker-compose.contabo.yml ]; then
              echo "ERROR: Missing /opt/inspect360/docker-compose.contabo.yml"
              exit 1
            fi
            if [ ! -f /opt/inspect360/.env ]; then
              echo "ERROR: Missing /opt/inspect360/.env — create it once on the server (see deployment/env.contabo.template)"
              exit 1
            fi

            cd /opt/inspect360
            export IMAGE
            docker compose -f docker-compose.contabo.yml up -d --force-recreate
            docker image prune -f

            echo "=== Container status ==="
            docker ps --filter name=inspect360

            echo "=== Waiting for health check (up to 90s) ==="
            for i in $(seq 1 18); do
              status=$(docker inspect inspect360 --format '{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
              echo "  attempt $i: $status"
              if [ "$status" = "healthy" ]; then
                echo "Deploy OK — container is healthy"
                exit 0
              fi
              sleep 5
            done

            echo "WARN: Container not healthy yet — check logs:"
            docker logs --tail 80 inspect360
            exit 1
        env:
          IMAGE: ${{ steps.image.outputs.name }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
