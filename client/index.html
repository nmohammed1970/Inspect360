<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Inspect360 - AI Building Inspections</title>
    <meta name="theme-color" content="#003764" />
    <meta name="description" content="AI-powered building inspection platform for Build-to-Rent operations" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS PWA Support -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inspect360" />
    <!-- Fonts: system stack only (no Google Fonts CDN — avoids DNS failures offline/restricted networks) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only register service worker in production mode
      if ('serviceWorker' in navigator && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
              // Silently fail in development - service workers can be problematic
              if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('Service Worker registration skipped in development mode');
              } else {
                console.error('Service Worker registration failed:', error);
              }
            });
        });
      } else if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        // Unregister any existing service workers in development
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => {
            registration.unregister().then(() => {
              console.log('Service Worker unregistered for development mode');
            });
          });
        });
      }
    </script>
  </body>
</html>
